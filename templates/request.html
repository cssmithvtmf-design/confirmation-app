<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Smitty Blends Appointment Request</title>

<style>

body{
    background:#0d0d0d;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
}

.container{
    max-width:450px;
    margin:auto;
    padding:20px;
}

.logo{
    width:100%;
    max-width:300px;
    margin-bottom:20px;
}

.card{
    background:#1a1a1a;
    padding:20px;
    border-radius:12px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#d60000;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.tagline{
    color:#bbbbbb;
    margin-top:20px;
    font-size:14px;
}
select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
    display:block;
}
textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
    resize:vertical;
}


</style>

</head>

<body>

<div class="container">
<h2>Request Appointment</h2>    
<form method="POST">
<img
    src="/static/logo.png"
    class="logo"
    alt="Smitty Blends">

<div class="card">
<label><strong>Your Name:</strong></label>
<input
    name="client"
    placeholder="Your Name"
    required>
    
<label><strong>Telephone Number:</strong></label>
<input
    type="tel"
    name="phone"
    placeholder="Cell#">
    
<label><strong>Requested Date:</strong></label>

<input
    type="date"
    id="appointment_date"
    name="date"
    required>

<label><strong>Available Appointment Time:</strong></label>

<select
    id="appointment_time"
    name="time"
    required>

    <option value="">
        Select Date First
    </option>

</select>

<label><strong>Description Of Services:</strong></label>

<textarea
    name="notes"
    placeholder="Requested Service or Notes"
    rows="4"></textarea>

<label><strong>Requested Price:</strong></label>

<input
    type="number"
    step="0.01"
    inputmode="decimal"
    name="suggested_price"
    placeholder="Suggested Price (Optional)">

<button type="submit">
    Submit Request
</button>

<script>

document
    .getElementById("appointment_date")
    .addEventListener(
        "change",
        async function(){

            const date =
                this.value;

            const response =
                await fetch(
                    "/api/availability/" +
                    date
                );

            const slots =
                await response.json();

            const dropdown =
                document.getElementById(
                    "appointment_time"
                );

            dropdown.innerHTML = "";

            if(slots.length === 0){

                const option =
                    document.createElement(
                        "option"
                    );

                option.text =
                    "No Available Times";

                option.value =
                    "";

                dropdown.add(option);

                return;
            }

            for(
                let i = 0;
                i < slots.length;
                i++
            ){

                const option =
                    document.createElement(
                        "option"
                    );

                option.text =
                    slots[i];

                option.value =
                    slots[i];

                dropdown.add(
                    option
                );

            }

        }
    );

</script>
</form>

</div>

<div class="tagline">

<b>Look Good.</b><br>
<b>Feel Confident.</b><br>
<b><u>Leave Like A Boss.</u></b>

</div>

</div>

</body>
</html>

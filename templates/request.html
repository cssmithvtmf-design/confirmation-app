<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Smitty Blends Appointment Request</title>

<style>

body{
    background:#0d0d0d;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
}

.container{
    max-width:450px;
    margin:auto;
    padding:20px;
}

.logo{
    width:100%;
    max-width:300px;
    margin-bottom:20px;
}

.card{
    background:#1a1a1a;
    padding:20px;
    border-radius:12px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#d60000;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.tagline{
    color:#bbbbbb;
    margin-top:20px;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">
<h2>Request Appointment</h2>    
<form method="POST">
<img
    src="/static/logo.png"
    class="logo"
    alt="Smitty Blends">

<div class="card">
<label><strong>Your Name:</strong></label>
<input
    name="client"
    placeholder="Your Name"
    required>
    
<label><strong>Telephone Number:</strong></label>
<input
    type="tel"
    name="phone"
    placeholder="Cell#">
    
<label><strong>Requested Date:</strong></label>        
<input
    type="date"
    name="date"
    required>

<label><strong>Requested Time:</strong></label>
<input
    type="time"
    name="time">

<label><strong>Description Of Services:</strong></label>
<textarea
    name="notes"
    placeholder="Requested Service or Notes"
    rows="4"
    style="width:100%;padding:10px;box-sizing:border-box;border-radius:8px;"></textarea>

<label><strong>Requested Price:</strong></label>
<input
    type="number"
    step="0.01"
    inputmode="decimal"
    name="suggested_price"
    placeholder="Suggested Price (Optional)">

<button type="submit">
    Submit Request
</button>

</form>

</div>

<div class="tagline">

<b>Look Good.</b><br>
<b>Feel Confident.</b><br>
<b><u>Leave Like A Boss.</u></b>

</div>

</div>

</body>
</html>

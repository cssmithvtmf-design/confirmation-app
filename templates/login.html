
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

body{
    margin:0;
    background:#0d0d0d;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:500px;
    margin:auto;
    padding:30px;
    text-align:center;
}

.logo{
    width:100%;
    max-width:250px;
    display:block;
    margin:0 auto 20px auto;
}

.card{
    background:#1a1a1a;
    border-radius:10px;
    padding:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#d60000;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.error{
    color:#ff6666;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<img
    src="/static/logo.png"
    class="logo"
    alt="Smitty Blends">
<form method="POST">

<input
    type="password"
    name="password"
    placeholder="Password"
    required>

<button type="submit">
    Login
</button>

</form>

{% if error %}

<p class="error">
    {{ error }}
</p>

{% endif %}

</div>

</div>

</body>
</html>
